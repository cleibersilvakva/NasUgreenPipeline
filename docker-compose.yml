services:
  nasugreen:
    image: cleibersilva/nasugreen:4.3.1
    container_name: nasugreen
    restart: unless-stopped

    ports:
      - "9090:9090"   # Dashboard web acessível em http://IP-DO-NAS:9090

    volumes:
      # Pasta de ENTRADA no NAS → /input dentro do container
      # Use :ro se o modo for "copy"; remova :ro se o modo for "move"
      - ./input:/input:ro

      # Pasta de SAÍDA no NAS → /output dentro do container
      - ./output:/output

      # Arquivo de configuração
      - ./config.docker.yaml:/config/config.yaml:ro

    environment:
      - TZ=America/Sao_Paulo

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
