[project]
name = "media-repo-pipeline"
version = "4.3.2"
description = "Pipeline de ingestão dinâmica e consolidação de repositórios de mídia"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
web = []

[project.scripts]
media-repo-pipeline     = "media_repo_pipeline.main:__main_entry"
media-repo-pipeline-web = "web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "media_repo_pipeline",
    "web",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
